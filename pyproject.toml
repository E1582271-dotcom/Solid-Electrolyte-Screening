[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p1screen"
version = "0.1.0"
description = "Auditable composition-first screening of Li-S solid-electrolyte candidate space"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jieao Jia" }]
keywords = ["solid electrolyte", "materials screening", "ionic conductivity"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "catboost>=1.2",
  "pymatgen>=2024.1",
  "matminer>=0.9",
  "matplotlib>=3.7",
  "pillow>=9",
  "mp-api>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
p1screen = "p1screen.cli:main"

[project.urls]
Repository = "https://github.com/E1582271-dotcom/Solid-Electrolyte-Screening"
Issues = "https://github.com/E1582271-dotcom/Solid-Electrolyte-Screening/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
